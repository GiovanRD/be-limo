# Localisation lidar (AMCL) sur la carte de la salle 207, repère "room_map".
# Chargé par real_l2.launch.py localization:=lidar.

amcl:
  ros__parameters:
    base_frame_id: base_link
    odom_frame_id: odom
    global_frame_id: room_map
    scan_topic: scan
    robot_model_type: differential
    tf_broadcast: true
    transform_tolerance: 0.5
    # odometry noise (LIMO on the mat: wheel slip in turns)
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    # particle filter
    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1
    recovery_alpha_fast: 0.1
    recovery_alpha_slow: 0.001
    # update often: the robot is slow and the track is small
    update_min_d: 0.05
    update_min_a: 0.1
    # laser model
    laser_model_type: likelihood_field
    laser_min_range: 0.2
    laser_max_range: 8.0
    laser_likelihood_max_dist: 2.0
    max_beams: 90
    sigma_hit: 0.2
    z_hit: 0.5
    z_rand: 0.5
    z_max: 0.05
    z_short: 0.05
    do_beamskip: false
    save_pose_rate: 0.5

map_server:
  ros__parameters:
    frame_id: room_map
    topic_name: map
