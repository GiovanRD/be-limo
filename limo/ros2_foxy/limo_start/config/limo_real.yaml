# Physical LIMO configuration.
# Command-line launch arguments override values in the launch section.

launch:
  steering_left_scale: 1.0
  steering_right_scale: 1.0
  port_name: ttyTHS1

  use_lidar: true
  use_camera: true
  open_rviz: false

  # Camera pose relative to base_link.
  camera_x: 0.10
  camera_y: 0.0
  camera_z: 0.065
  camera_roll: 0.0
  camera_pitch: 0.0
  camera_yaw: 0.0

# Arguments forwarded to the Astra camera launch file.
camera_driver:
  camera_name: camera
  color_width: 640
  color_height: 480
  depth_width: 640
  depth_height: 400
  enable_point_cloud: false
  enable_ir: false
  color_depth_synchronization: true
  tf_publish_rate: 0.0